# ==============================================================================
# DocuMind AI — Enterprise Nginx Reverse Proxy Configuration
# Features: SSL/TLS Termination, HTTP to HTTPS Redirect, WebSocket Support, Rate Limiting
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting: 20 requests/sec with burst buffer of 50
    limit_req_zone $binary_remote_addr zone=documind_limit:10m rate=20r/s;

    # Max upload file size (PDFs/Images up to 100MB)
    client_max_body_size 100M;

    # --------------------------------------------------------------------------
    # HTTP Server (Port 80) — Redirects all traffic to HTTPS & Certbot Challenges
    # --------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # HTTPS Server (Port 443) — Reverse Proxy to Streamlit DocuMind Application
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name documind.yourcompany.com;

        # SSL Certificates (Provided by Certbot / Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/documind.yourcompany.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/documind.yourcompany.com/privkey.pem;

        # SSL Protocols & Ciphers Optimization
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Hardening Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Application Route
        location / {
            limit_req zone=documind_limit burst=50 nodelay;
            
            proxy_pass http://documind-app:8501;
            proxy_http_version 1.1;
            
            # WebSocket & Streaming Support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Disable buffering for real-time LLM token streaming
            proxy_buffering off;
            proxy_read_timeout 86400;
        }
    }
}
