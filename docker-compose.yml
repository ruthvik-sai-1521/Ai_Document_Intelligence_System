version: '3.8'

services:
  documind-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: documind-ai:latest
    container_name: documind-container
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-documind_enterprise_secure_jwt_secret_key_2026}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-all-MiniLM-L6-v2}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.15}
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      # Persistent storage volume mappings
      - ./data:/app/data
      - ./logs:/app/logs
      - ./embeddings:/app/embeddings
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  documind_data:
  documind_logs:
  documind_embeddings:
