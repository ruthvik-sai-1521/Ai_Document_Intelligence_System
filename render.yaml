services:
  - type: web
    name: documind-ai
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /_stcore/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: EMBEDDING_MODEL_NAME
        value: all-MiniLM-L6-v2
      - key: CONFIDENCE_THRESHOLD
        value: "0.15"
    disk:
      name: documind-data-disk
      mountPath: /app/data
      sizeGB: 10
